version: '3.8'

services:
  # Central Healthcare Node.js Backend & Socket.IO
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lnmiit_health_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=lnmiit_smart_healthcare_super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:5173
      - NLP_SERVICE_URL=http://nlp-service:8000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/dev.db:/app/dev.db

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lnmiit_health_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Bio-NLP Medical Assistant Microservice
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: lnmiit_health_nlp
    restart: always
    ports:
      - "8000:8000"

  # MQTT Mosquitto Broker for ESP32 Sensor Nodes
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: lnmiit_health_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
